name: CI

# The only workflow that runs for pull requests and pushes to master. The changes job works out whether a change
# needs building at all (documentation-only changes don't). "CI result" is the one required check.
on:
  push:
    branches: [master]
    # Release-please's own files: release PRs and their merges are checked by the Release workflow instead.
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
  pull_request:
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: Run every build and test job (CodeQL and the commit check are skipped).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      commits: ${{ steps.affected.outputs.commits }}
      build: ${{ steps.affected.outputs.build }}
      codeql: ${{ steps.affected.outputs.codeql }}
    steps:
      - name: Work out the affected jobs
        id: affected
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ inputs.full }}
          PR: ${{ github.event.pull_request.number }}
          PR_FILES: ${{ github.event.pull_request.changed_files }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$FULL" = true ]; then
            # Called by the Release workflow before it publishes.
            printf '%s\n' commits=false build=true 'codeql=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          complete=false
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
              # The API lists at most 3000 files.
              [ "$PR_FILES" -gt 3000 ] || complete=true
              ;;
            push)
              if [ "$BEFORE" != 0000000000000000000000000000000000000000 ] &&
                compare=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA"); then
                files=$(jq -r '.files[] | .filename, (.previous_filename // empty)' <<< "$compare")
                # The API lists at most 300 files.
                complete=$(jq '.files | length < 300' <<< "$compare")
              fi
              ;;
            *)
              # Manual runs check everything.
              printf '%s\n' commits=false build=true 'codeql=["actions","csharp"]' >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if [ "$complete" != true ]; then
            echo "Couldn't list every changed file; running everything."
            printf '%s\n' commits=true build=true 'codeql=["actions","csharp"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Changed files:\n%s\n' "$files"

          # Documentation and repository metadata don't need a build. Anything else, including files this list
          # doesn't recognise, builds and tests everything.
          docs='.*\.md|docs/.*|LICENSE|\.github/ISSUE_TEMPLATE/.*|\.github/CODEOWNERS|\.github/dependabot\.yml'
          if grep -v -x -E "$docs" <<< "$files" | grep -q .; then build=true; else build=false; fi

          languages=()
          grep -q -E '\.cs$|\.csproj$|\.props$|\.targets$' <<< "$files" && languages+=('"csharp"')
          grep -q '^\.github/workflows/' <<< "$files" && languages+=('"actions"')
          codeql="[$(IFS=,; echo "${languages[*]}")]"

          printf '%s\n' commits=true "build=$build" "codeql=$codeql" | tee -a "$GITHUB_OUTPUT"

  commits:
    name: Conventional commits
    needs: changes
    if: needs.changes.outputs.commits == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # Squash merges use the pull request title as the commit message. The title comes from the API rather than the
      # event, so re-running this job after renaming the pull request checks the new title.
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title --jq .title | npx commitlint --verbose

      - name: Check pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE" --to "$HEAD" --verbose

      - name: Check pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
            npx commitlint --from "$BEFORE" --to HEAD --verbose
          else
            # New branch or rewritten history: check every commit, including the root.
            root="$(git rev-list --max-parents=0 HEAD)"
            git log -1 --format=%B "$root" | npx commitlint --verbose
            npx commitlint --from "$root" --to HEAD --verbose
          fi

  build:
    name: Build & test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows also runs the tests on .NET Framework 4.8, against the netstandard2.0 build.
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The SDK global.json asks for, plus the .NET 10 runtime the tests run on.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      - name: Build
        run: dotnet build AlphaSoftware.Snapshotter.slnx -c Release

      - name: Test
        run: dotnet test --solution AlphaSoftware.Snapshotter.slnx -c Release --no-build

      - name: Upload received snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: received-${{ matrix.name }}
          path: '**/*.received.*'
          if-no-files-found: ignore
          retention-days: 14

  pack:
    name: Pack & package check
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The SDK global.json asks for, plus the .NET 10 runtime the tests run on.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      - name: Pack
        run: dotnet pack src/AlphaSoftware.Snapshotter -c Release -o artifacts

      # No test framework, and the package rather than the project: proves the nupkg works on its own.
      - name: Run the console sample against the package
        run: dotnet run --project samples/ConsoleSample -c Release

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/
          if-no-files-found: error

  codeql:
    name: CodeQL
    needs: changes
    if: needs.changes.outputs.codeql != '[]'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    with:
      languages: ${{ needs.changes.outputs.codeql }}

  # The required check. It passes when every job passed or was skipped (not affected by the change), and fails if any
  # job failed or was cancelled.
  result:
    name: CI result
    needs: [changes, commits, build, pack, codeql]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check the job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null
