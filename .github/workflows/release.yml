name: Release

# Pushing a Snapshotter-v1.2.3 tag on a master commit releases 1.2.3: the full CI runs, then the package is packed
# (MinVer takes the version from the tag) and published to nuget.org. See docs/releasing.md.
on:
  push:
    tags: ['Snapshotter-v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  ci:
    name: CI
    # Covers what ci.yml's jobs declare, including CodeQL's, although CodeQL doesn't run here.
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  pack:
    name: Pack
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag
        run: |
          git merge-base --is-ancestor HEAD origin/master ||
            { echo "::error::$GITHUB_REF_NAME isn't on master."; exit 1; }
          [[ "${GITHUB_REF_NAME#Snapshotter-v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] ||
            { echo "::error::$GITHUB_REF_NAME isn't Snapshotter-v followed by a version, like Snapshotter-v1.2.3."; exit 1; }

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack src/AlphaSoftware.Snapshotter -c Release -o artifacts

      - name: Check the package
        run: |
          version="${GITHUB_REF_NAME#Snapshotter-v}"
          test -f "artifacts/AlphaSoftware.Snapshotter.$version.nupkg" && test -f "artifacts/AlphaSoftware.Snapshotter.$version.snupkg"

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/
          if-no-files-found: error

  nuget-org:
    name: Publish to nuget.org
    needs: pack
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # NuGet trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Log in to nuget.org (trusted publishing)
        id: nuget-login
        if: vars.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Configure NuGet trusted publishing (vars.NUGET_USER) or the NUGET_API_KEY secret. See docs/releasing.md."
            exit 1
          fi
          # The symbol package (.snupkg) next to the .nupkg is pushed automatically.
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
